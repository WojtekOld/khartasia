services:
  _defaults:
    autowire: true

  ui_patterns_legacy.twig.extension:
    class: Drupal\ui_patterns_legacy\Template\TwigExtension
    tags:
      - { name: 'twig.extension' }

  Drupal\ui_patterns_legacy\ComponentDiscovery: ~
  ui_patterns_legacy.discovery: '@Drupal\ui_patterns_legacy\ComponentDiscovery'

  Drupal\ui_patterns_legacy\RenderableConverter: ~
  ui_patterns_legacy.renderable_converter: '@Drupal\ui_patterns_legacy\RenderableConverter'

  Drupal\ui_patterns_legacy\ComponentConverter: ~
  ui_patterns_legacy.component_converter: '@Drupal\ui_patterns_legacy\ComponentConverter'

  Drupal\ui_patterns_legacy\ComponentWriter: ~
  ui_patterns_legacy.component_writer: '@Drupal\ui_patterns_legacy\ComponentWriter'

  Drupal\ui_patterns_legacy\ConfigurationConverter: ~
  ui_patterns_legacy.configuration_converter: '@Drupal\ui_patterns_legacy\ConfigurationConverter'

  Drupal\ui_patterns_legacy\StoryExtractor: ~
  ui_patterns_legacy.story_extractor: '@Drupal\ui_patterns_legacy\StoryExtractor'

  Drupal\ui_patterns_legacy\Element\ComponentElementAlter: ~
  ui_patterns_legacy.component_element_alter: '@Drupal\ui_patterns_legacy\Element\ComponentElementAlter'

  Drupal\ui_patterns_legacy\Service\ConfigurationUpdater: ~
  Drupal\ui_patterns_legacy\Service\ConfigurationUpdaterInterface: '@Drupal\ui_patterns_legacy\Service\ConfigurationUpdater'
  ui_patterns_legacy.configuration_updater: '@Drupal\ui_patterns_legacy\Service\ConfigurationUpdater'

  Drupal\ui_patterns_legacy\Service\LayoutBuilderUpdater: ~
  Drupal\ui_patterns_legacy\Service\LayoutBuilderUpdaterInterface: '@Drupal\ui_patterns_legacy\Service\LayoutBuilderUpdater'
  ui_patterns_legacy.layout_builder_updater: '@Drupal\ui_patterns_legacy\Service\LayoutBuilderUpdater'

  Drupal\ui_patterns_legacy\Hook\UiPatternsLegacyHooks: ~
