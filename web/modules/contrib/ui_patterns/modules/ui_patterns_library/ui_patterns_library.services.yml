services:
  _defaults:
    autowire: true

  ui_patterns_library.twig.extension:
    class: Drupal\ui_patterns_library\Template\TwigExtension
    tags:
      - { name: 'twig.extension' }

  Drupal\ui_patterns_library\Element\ComponentElementAlter: ~
  ui_patterns_library.component_element_alter: '@Drupal\ui_patterns_library\Element\ComponentElementAlter'

  Drupal\ui_patterns_library\StoriesSyntaxConverter: ~
  ui_patterns_library.stories_syntax_converter: '@Drupal\ui_patterns_library\StoriesSyntaxConverter'

  Drupal\ui_patterns_library\StoryPluginManager: ~
  plugin.manager.component_story: '@Drupal\ui_patterns_library\StoryPluginManager'

  Drupal\ui_patterns_library\Hook\UiPatternsLibraryHooks: ~
