services:
  _defaults:
    autoconfigure: true
    autowire: true

  logger.channel.ui_patterns:
    parent: logger.channel_base
    arguments:
      - 'ui_patterns'

  # Plugins managers.

  Drupal\ui_patterns\ComponentPluginManager:
    decorates: plugin.manager.sdc
    decoration_priority: -100
    parent: plugin.manager.sdc
    arguments:
      $decorated: '@.inner'
    calls:
      - [ setPropTypePluginManager, [ '@plugin.manager.ui_patterns_prop_type' ] ]
      - [ setPropTypePluginAdapter, [ '@plugin.manager.ui_patterns_prop_type_adapter' ] ]
      - [ setReferenceSolver, [ '@ui_patterns.schema_reference_solver' ] ]
      - [ setModuleExtensionList, [ '@extension.list.module' ] ]

  Drupal\ui_patterns\PropTypePluginManager:
    parent: default_plugin_manager
    arguments:
      - '@Drupal\ui_patterns\SchemaManager\CompatibilityChecker'
      - '@Drupal\Core\TypedData\TypedDataManagerInterface'
  plugin.manager.ui_patterns_prop_type: '@Drupal\ui_patterns\PropTypePluginManager'

  Drupal\ui_patterns\PropTypeAdapterPluginManager:
    parent: default_plugin_manager
    arguments:
      - '@Drupal\ui_patterns\SchemaManager\CompatibilityChecker'
  plugin.manager.ui_patterns_prop_type_adapter: '@Drupal\ui_patterns\PropTypeAdapterPluginManager'

  Drupal\ui_patterns\SourcePluginManager:
    parent: default_plugin_manager
    arguments:
      - '@Drupal\ui_patterns\PropTypePluginManager'
      - '@Drupal\Core\Plugin\Context\ContextHandlerInterface'
      - '@Drupal\Core\Entity\EntityTypeManagerInterface'
  plugin.manager.ui_patterns_source: '@Drupal\ui_patterns\SourcePluginManager'

  Drupal\ui_patterns\DerivableContextPluginManager:
    parent: default_plugin_manager
    arguments:
      - '@Drupal\Core\Entity\EntityTypeManagerInterface'
  plugin.manager.ui_patterns_derivable_context: '@Drupal\ui_patterns\DerivableContextPluginManager'

  # Render elements management.
  Drupal\ui_patterns\Element\ComponentElementBuilder: ~
  ui_patterns.component_element_builder: '@Drupal\ui_patterns\Element\ComponentElementBuilder'

  Drupal\ui_patterns\Element\ComponentElementAlter: ~
  ui_patterns.component_element_alter: '@Drupal\ui_patterns\Element\ComponentElementAlter'

  # JSON schema management.
  Drupal\ui_patterns\SchemaManager\StreamWrapper:
    tags:
      - { name: 'stream_wrapper', scheme: 'ui-patterns' }

  ui_patterns.schema_stream_wrapper: '@Drupal\ui_patterns\SchemaManager\StreamWrapper'

  Drupal\ui_patterns\SchemaManager\CompatibilityChecker: ~
  ui_patterns.schema_compatibility_checker: '@Drupal\ui_patterns\SchemaManager\CompatibilityChecker'

  Drupal\ui_patterns\SchemaManager\Canonicalizer: ~
  ui_patterns.schema_canonicalizer: '@Drupal\ui_patterns\SchemaManager\Canonicalizer'

  Drupal\ui_patterns\SchemaManager\ReferencesResolver: ~
  ui_patterns.schema_reference_solver: '@Drupal\ui_patterns\SchemaManager\ReferencesResolver'

  # Others.
  Drupal\ui_patterns\Template\TwigExtension:
    tags:
      - { name: 'twig.extension' }

  Drupal\ui_patterns\Entity\SampleEntityGenerator: ~
  Drupal\ui_patterns\Entity\SampleEntityGeneratorInterface: '@Drupal\ui_patterns\Entity\SampleEntityGenerator'
  ui_patterns.sample_entity_generator: '@Drupal\ui_patterns\Entity\SampleEntityGenerator'

  Drupal\ui_patterns\EventSubscriber\UiPatternsEntitySchemaSubscriber: ~

  Drupal\ui_patterns\Resolver\ChainContextEntityResolver:
    tags:
      - { name: 'service_collector', call: 'addResolver', tag: 'ui_patterns.context_entity_resolver' }
  Drupal\ui_patterns\Resolver\ChainContextEntityResolverInterface: '@Drupal\ui_patterns\Resolver\ChainContextEntityResolver'
  ui_patterns.chain_context_entity_resolver: '@Drupal\ui_patterns\Resolver\ChainContextEntityResolver'

  Drupal\ui_patterns\UiPatternsNormalizer: ~
  Drupal\ui_patterns\UiPatternsNormalizerInterface: '@Drupal\ui_patterns\UiPatternsNormalizer'
  ui_patterns.normalizer: '@Drupal\ui_patterns\UiPatternsNormalizer'

  Drupal\ui_patterns\Hook\UiPatternsHooks: ~
  Drupal\ui_patterns\Hook\FieldConfigDelete: ~
