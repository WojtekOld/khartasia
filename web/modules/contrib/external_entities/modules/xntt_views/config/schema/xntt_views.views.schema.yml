views.field.rendered_external_entity:
  type: views_field
  label: 'Rendered external entity'
  mapping:
    view_mode:
      type: string
      label: 'View mode'

views.field.external_entity_field:
  type: views_field
  label: 'Views external entity field handler'
  mapping:
    click_sort_column:
      type: string
      label: 'Column used for click sorting'
    type:
      type: string
      label: 'Formatter'
    settings:
      label: 'Settings'
      type: field.formatter.settings.[%parent.type]
    group_column:
      type: string
      label: 'Group by column'
    group_columns:
      type: sequence
      label: 'Group by columns'
      sequence:
        type: string
        label: 'Column'
    group_rows:
      type: boolean
      label: 'Display all values in the same row'
    delta_limit:
      type: integer
      label: 'Field'
    delta_offset:
      type: integer
      label: 'Offset'
    delta_reversed:
      type: boolean
      label: 'Reversed'
    delta_first_last:
      type: boolean
      label: 'First and last only'
    multi_type:
      type: string
      label: 'Display type'
    separator:
      type: label
      label: 'Separator'
    field_api_classes:
      type: boolean
      label: 'Use field template'

views.field.external_entity_field_language:
  type: views.field.external_entity_field
  label: 'Views language field handler for external entities'
  mapping:
    display:
      type: string
      label: 'Display format'

views.field.external_entity_link:
  type: views_field
  label: 'External entity link'
  mapping:
    text:
      type: label
      label: 'Text to display'
    output_url_as_text:
      type: boolean
      label: 'Output the URL as text'
    absolute:
      type: boolean
      label: 'Output an absolute link'

views.field.external_entity_link_delete:
  type: views.field.entity_link
  label: 'Entity delete link'

views.field.external_entity_link_edit:
  type: views.field.external_entity_link
  label: 'Entity edit link'
