khartasia_guided_forms.papier_nouveau:
  path: '/papier/nouveau-guide'
  defaults:
    _title: 'Nouveau Papier — Saisie guidée'
    _form: '\Drupal\khartasia_guided_forms\Form\PapierBaseForm'
  requirements:
    _permission: 'access content'

khartasia_guided_forms.papier_attestations:
  path: '/papier/{papier_nid}/attestations-guide'
  defaults:
    _title: 'Attestations — Saisie guidée'
    _form: '\Drupal\khartasia_guided_forms\Form\PapierAttestationsForm'
  requirements:
    _permission: 'access content'
    papier_nid: \d+

khartasia_guided_forms.attestation_ancrage:
  path: '/khartasia/attestation/nouvelle'
  defaults:
    _title: 'Nouvelle attestation — Ancrage'
    _form: '\Drupal\khartasia_guided_forms\Form\AttestationAncrageForm'
  requirements:
    _permission: 'create attestation content'
    
khartasia_guided_forms.papier_recette:
  path: '/papier/{papier_nid}/recette'
  defaults:
    _title: 'Recette du papier — Saisie en série'
    _form: '\Drupal\khartasia_guided_forms\Form\PapierRecetteForm'
  requirements:
    _permission: 'create attestation content'
    papier_nid: \d+