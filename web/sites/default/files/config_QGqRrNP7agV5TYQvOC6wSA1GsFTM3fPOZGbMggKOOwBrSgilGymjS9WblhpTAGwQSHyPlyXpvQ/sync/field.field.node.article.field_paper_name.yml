default_value:
  -
    value: "In Asia and particularly in China, Korea and Japan, the papers are intended for a wide range of use: Papers for calligraphy and art,  Papers for ceremonies,  Paper as a medium of exchange, money paper,  Papers for making clothes, wall hangings and bedding,  Papers for architecture, interior design,  Papers for crafts of various kinds, for domestic purposes and leisure.\r\nThe names assigned to the paper refers to different notions: The material used, The place of production, The method of production, Appearance, Dimensions, Use, The name of an artist or a studio etc.\r\nEn Asie et plus particulièrement en Chine, Corée et Japon, les papiers sont destinés à une grande variété d’usage: Papiers pour la calligraphie et les arts, Papiers pour les cérémonies, Papiers comme moyen d’échange, Papier monnaie\r\nPapiers pour la confection des vêtements, de tentures murales et la literie, Papiers pour l’architecture, la décoration intérieure, Papiers pour les objets d’artisanat de diverses natures, destinés à des usages domestiques ou de loisirs. \r\nLes noms attribués aux papiers se réfèrent à diverses notions: Le matériau utilisé, Le lieu de production, La méthode de production, L’apparence, Les dimensions, L’utilisation, Le nom d’un artiste ou d’un atelier etc.\r\n"
