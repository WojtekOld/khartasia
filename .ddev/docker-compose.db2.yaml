services:
  db2:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: drupal7
      MYSQL_USER: drupal7
      MYSQL_PASSWORD: drupal7
    ports:
      - "3307:3306"
    volumes:
      - khartasia_db2:/var/lib/mysql

volumes:
  khartasia_db2: {}